[package]
name = "ping-viewer-next"
version = "0.0.0"
edition = "2021"
authors = ["Raul Victor Trombin <raulvtrombin@gmail.com>"]
description = "This crate serves as the entry point for embedding applications using Rust on Blue Robotics's Ping devices family"
repository = "https://github.com/bluerobotics/ping-viewer-next"
license = "MIT"

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.1"
actix-web = "=4.11.0"
actix-web-actors = "4.3.1"
bluerobotics-ping = { version="0.3.6", features = ["serde", "json_schema"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = {version = "4.5.40", features = ["derive"] }
dirs = "6.0.0"
foxglove = { version = "0.16.1", default-features = false, features = ["schemars"] }
lazy_static = "1.5.0"
mavlink = { default-features = false, features = ["std", "ardupilotmega", "tokio-1", "serde"], version = "0.16.2"}
mime_guess = "2.0.5"
openssl = { version = "0.10.75", features = ["vendored"], optional = true }
paperclip = { version = "0.9.5" , features = ["actix4", "swagger-ui", "uuid"] }
regex = "1.12.2"
reqwest = {version = "0.12.24", features = ["json"], optional = true }
rust-embed = "8.9.0"
schemars = { version = "1.1.0"}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
serde_json5 = { version = "0.2.1" }
shellexpand = "3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-serial = "5.4.5"
tokio-util = "0.7.17"
tracing = { version = "0.1.41", features = ["log", "async-await"] }
tracing-appender = "0.2.3"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-tracy = {version = "0.11.4", features = ["ondemand"] }
udp-stream = "0.0.12"
uuid = { version = "1.18.1", features = ["serde"] }
validator = "0.20.0"
zenoh = "1.6.2"

[build-dependencies]
vergen-gix = { version = "1.0.9", default-features = false, features = ["build", "cargo"] }

[lib]
name = "ping_viewer_next"
path = "src/lib.rs"

[[bin]]
name = "ping-viewer-next"
path = "src/main.rs"

[features]
default = ["embed-frontend"]
desktop-app = ["build-frontend"]
build-frontend = ["embed-frontend"]
embed-frontend =[]
blueos-extension = ["dep:reqwest", "dep:openssl"]
