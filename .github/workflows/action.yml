name: Test all targets

on: [push, pull_request]

permissions:
  contents: write

env:
  NODE_VERSION: "24"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quick-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        # Note: Dependencies after git are related to Tauri
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: |
            curl
            git
            libwebkit2gtk-4.0-dev
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set directory to safe for git
        # Note: Required by vergen (https://crates.io/crates/vergen)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install build dependencies - Rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies - Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check style
        run: cargo fmt --check

      - name: Check clippy
        run: cargo clippy --all-features

      - name: Build
        run: cargo build --verbose --locked

  build-frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ping-viewer-next-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx biome format

      - name: Lint check
        run: npx biome lint

      - name: Build project
        run: npm run build

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ping-viewer-next-frontend/dist

  build:
    needs: [quick-tests, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-14
          TARGET: aarch64-apple-darwin

        - os: macos-14
          TARGET: x86_64-apple-darwin

        - os: ubuntu-22.04
          TARGET: aarch64-unknown-linux-musl

        - os: ubuntu-22.04
          TARGET: armv7-unknown-linux-musleabihf

        - os: ubuntu-22.04
          TARGET: x86_64-unknown-linux-gnu

        - os: windows-2022
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: ./ping-viewer-next-frontend/dist

    - name: Build
      uses: houseabsolute/actions-rust-cross@v0.0.14
      with:
        target: ${{ matrix.TARGET }}
        args: "--release --locked --features 'embed-frontend blueos-extension'"

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/${{ github.event.repository.name }}${{ matrix.EXTENSION }} ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        path: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}

    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: ${{ github.event_name == 'push' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        asset_name: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        tag: ${{ github.ref }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        overwrite: true

  # Workaround while we don't fix current issue.
  # Issue: https://github.com/bluerobotics/ping-viewer-next/issues/65
  build-x86-musl:
    needs: [quick-tests, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v3
    - name: Rust Setup
      uses: actions-rs/toolchain@v1.0.1
      with:
        toolchain: stable
        target: ${{ matrix.TARGET }}
        override: true
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "rust-cache"
        shared-key: "build-cross-${{ matrix.TARGET }}"
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: ./ping-viewer-next-frontend/dist
    - name: Rust Cross Build
      uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --locked --release --features 'embed-frontend blueos-extension' --target=${{ matrix.TARGET }}
    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/${{ github.event.repository.name }}${{ matrix.EXTENSION }} ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        path: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: ${{ github.event_name == 'push' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        asset_name: ${{ github.event.repository.name }}-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        tag: ${{ github.ref }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        overwrite: true

  deploy-blueos:
    needs: [build, build-x86-musl]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create files directory
        run: mkdir -p ./blueos-ping-viewer-next/files/
      - name: Download armv7 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-armv7-unknown-linux-musleabihf
          path: ./blueos-ping-viewer-next/files/
      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-aarch64-unknown-linux-musl
          path: ./blueos-ping-viewer-next/files/
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-x86_64-unknown-linux-musl
          path: ./blueos-ping-viewer-next/files/
      - name: Prepare binaries
        run: |
          cd ./blueos-ping-viewer-next/files/
          mv ${{ github.event.repository.name }}-armv7-unknown-linux-musleabihf ping-viewer-next.armv7
          mv ${{ github.event.repository.name }}-aarch64-unknown-linux-musl ping-viewer-next.aarch64
          mv ${{ github.event.repository.name }}-x86_64-unknown-linux-musl ping-viewer-next.x86_64
          chmod +x ping-viewer-next.*
      - uses: BlueOS-community/Deploy-BlueOS-Extension@v1.2.0
        name: Deploy BlueOS Extension
        if: startsWith(github.ref, 'refs/tags/')
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ping-viewer-next
          author: Raul Victor Trombin
          author-email: raulvtrombin@gmail.com
          maintainer: Blue Robotics
          maintainer-email: support@bluerobotics.com
          dockerfile-location: "./blueos-ping-viewer-next"
          skip-checkout: 'true'

  build-desktop:
    needs: [quick-tests, build-frontend]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            formats: 'dmg'
            label: 'Mac-ARM64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            formats: 'dmg'
            label: 'Mac-x86'
          - platform: 'ubuntu-22.04'
            target: ''
            formats: 'deb,appimage'
            label: 'Linux'
          - platform: 'windows-latest'
            target: ''
            formats: 'nsis'
            label: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libgirepository1.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./ping-viewer-next-frontend/dist

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Install cargo-generate-rpm (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo install cargo-generate-rpm --locked

      - name: Use newer linuxdeploy (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        # cargo-packager only downloads linuxdeploy if it's missing from its cache, so seed it with the
        # newer build Tauri uses, whose excludelist keeps libwayland-client out of the AppImage
        # TODO: Remove after <https://github.com/crabnebula-dev/cargo-packager/issues/493>
        run: |
          mkdir -p "$HOME/.cache/.cargo-packager/AppImage"
          curl -fsSL -o "$HOME/.cache/.cargo-packager/AppImage/linuxdeploy-x86_64.AppImage" \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          chmod 764 "$HOME/.cache/.cargo-packager/AppImage/linuxdeploy-x86_64.AppImage"

      - name: Package (native)
        if: matrix.target == ''
        shell: bash
        run: |
          cargo packager \
            --packages ping-viewer-next-desktop \
            --release \
            --formats ${{ matrix.formats }}

      - name: Package RPM (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo generate-rpm --package ping-viewer-next-desktop

      - name: Package (cross-target, macOS)
        if: matrix.target != ''
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo packager \
          --packages ping-viewer-next-desktop \
          --release \
          --target ${{ matrix.target }} \
          --formats ${{ matrix.formats }}

      - name: Collect artifacts
        id: collect
        if: matrix.target == ''
        shell: bash
        run: |
          mkdir -p dist-packages
          find target/release -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \) \
            -exec cp {} dist-packages/ \;
          if [ -d target/generate-rpm ]; then
            cp target/generate-rpm/*.rpm dist-packages/
          fi
          ls -la dist-packages

      - name: Collect artifacts (macOS only)
        id: collect-target
        if: matrix.target != ''
        shell: bash
        run: |
          mkdir -p dist-packages
          find target -type f \
            -name '*.dmg' \
            -exec cp {} dist-packages/ \;
          ls -la dist-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'ping-viewer_${{ matrix.label }}'
          path: dist-packages/*
          retention-days: 5

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'Ping Viewer 2 v${{ github.ref_name }}'
          files: dist-packages/*
