[package]
name = "ping-viewer-next-desktop"
version = "0.2.0"
description = "Ping Viewer Next Desktop App"
authors = ["Blue Robotics <software@bluerobotics.com>"]
edition = "2021"
repository = "https://github.com/bluerobotics/ping-viewer-next/"
license = "MIT"

[dependencies]
actix-web = { workspace = true }
app_dirs2 = "2.5.5"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ping-viewer-next = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }
tao = "0.37.1"
tokio = { workspace = true }
wry = "0.57.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

# Reference:
# <https://github.com/crabnebula-dev/cargo-packager/blob/a2682b1e5dbd10b513ba9dc882462160acfee2c3/examples/wry/Cargo.toml>
[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Ping Viewer"
identifier = "com.ping-viewer-next-desktop.app"
version = "0.2.0"
description = "Ping Viewer desktop app"
authors = ["Blue Robotics"]
category = "Utility"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[package.metadata.packager.deb]
depends = [
  "libgtk-3-0",
  "libwebkit2gtk-4.1-0",
  "gstreamer1.0-plugins-base",
  "gstreamer1.0-plugins-good",
]

[package.metadata.packager.appimage]
libs = [
  "WebKitNetworkProcess",
  "WebKitWebProcess",
  "libwebkit2gtkinjectedbundle.so",
]

[package.metadata.packager.appimage.linuxdeploy-plugins]
"gtk" = "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"

[package.metadata.packager.nsis]
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]
preinstall-section = """
; Setup messages
; English
LangString webview2AbortError ${LANG_ENGLISH} "Failed to install WebView2! The app can't run without it. Try restarting the installer."
LangString webview2DownloadError ${LANG_ENGLISH} "Error: Downloading WebView2 Failed - $0"
LangString webview2DownloadSuccess ${LANG_ENGLISH} "WebView2 bootstrapper downloaded successfully"
LangString webview2Downloading ${LANG_ENGLISH} "Downloading WebView2 bootstrapper..."
LangString webview2InstallError ${LANG_ENGLISH} "Error: Installing WebView2 failed with exit code $1"
LangString webview2InstallSuccess ${LANG_ENGLISH} "WebView2 installed successfully"

Section PreInstall
  ; Check if Webview2 is already installed and skip this section
  ${If} ${RunningX64}
    ReadRegStr $4 HKLM "SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" "pv"
  ${Else}
    ReadRegStr $4 HKLM "SOFTWARE\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" "pv"
  ${EndIf}
  ReadRegStr $5 HKCU "SOFTWARE\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" "pv"

  StrCmp $4 "" 0 webview2_done
  StrCmp $5 "" 0 webview2_done

  Delete "$TEMP\\MicrosoftEdgeWebview2Setup.exe"
  DetailPrint "$(webview2Downloading)"
  nsis_tauri_utils::download "https://go.microsoft.com/fwlink/p/?LinkId=2124703" "$TEMP\\MicrosoftEdgeWebview2Setup.exe"
  Pop $0
  ${If} $0 == 0
      DetailPrint "$(webview2DownloadSuccess)"
  ${Else}
      DetailPrint "$(webview2DownloadError)"
      Abort "$(webview2AbortError)"
  ${EndIf}
  StrCpy $6 "$TEMP\\MicrosoftEdgeWebview2Setup.exe"

  DetailPrint "$(installingWebview2)"
  ; $6 holds the path to the webview2 installer
  ExecWait "$6 /install" $1
  ${If} $1 == 0
    DetailPrint "$(webview2InstallSuccess)"
  ${Else}
    DetailPrint "$(webview2InstallError)"
    Abort "$(webview2AbortError)"
  ${EndIf}
  webview2_done:
SectionEnd
"""

[package.metadata.generate-rpm]
name = "ping-viewer-next"
summary = "Ping Viewer desktop app"
auto-req = "disabled"
assets = [
  { source = "target/release/ping-viewer-next-desktop", dest = "/usr/bin/ping-viewer-next-desktop", mode = "755" },
  { source = "ping-viewer-next-desktop/linux/ping-viewer-next-desktop.desktop", dest = "/usr/share/applications/ping-viewer-next-desktop.desktop", mode = "644" },
  { source = "ping-viewer-next-desktop/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/ping-viewer-next-desktop.png", mode = "644" },
  { source = "ping-viewer-next-desktop/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/ping-viewer-next-desktop.png", mode = "644" },
  { source = "ping-viewer-next-desktop/icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/128x128@2/apps/ping-viewer-next-desktop.png", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"

[package.metadata.generate-rpm.requires]
"libwebkit2gtk-4.1.so.0()(64bit)" = "*"
"libgtk-3.so.0()(64bit)" = "*"
